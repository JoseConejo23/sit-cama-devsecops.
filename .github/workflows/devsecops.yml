
name: Pipeline DevSecOps - SIT-Cama

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Deteccion de secretos
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revisar secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2

  code-security:
    name: Analisis de codigo
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Analisis SAST con Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

  filesystem-scan:
    name: Analisis de dependencias y archivos
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Analisis con Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
