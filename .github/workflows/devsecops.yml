
name: Pipeline DevSecOps - SIT-Cama

on:
  push:
    branches:
      - main
      - feature/pipeline-devsecops
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  secret-scan:
    name: Deteccion de secretos
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Revisar secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-security:
    name: Analisis de codigo
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Instalar Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Analisis SAST con Semgrep
        run: semgrep scan --config p/default src/

  filesystem-scan:
    name: Analisis de archivos
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Analisis con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

  dast-scan:
    name: Analisis DAST con OWASP ZAP
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Iniciar aplicacion web
        run: |
          python3 -m http.server 8080 --directory web > /tmp/web.log 2>&1 &
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              echo "Aplicacion web iniciada correctamente"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/web.log
          exit 1

      - name: Analisis DAST con OWASP ZAP
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://127.0.0.1:8080'
          cmd_options: '-m 1'
          allow_issue_writing: false
          fail_action: false

      - name: Guardar reporte de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-owasp-zap
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
